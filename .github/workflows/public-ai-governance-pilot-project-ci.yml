name: Public-AI-Governance Pilot Project CI Validation

on:
  push:
    branches:
      - adoption/public-ai-governance-v0.10.0

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Your_strong_Password123
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Your_strong_Password123 -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_SQLSERVER_BASE_CONNECTION: Server=localhost,1433;User Id=sa;Password=Your_strong_Password123;TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False;
    steps:
      - name: Check out pilot branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: adoption/public-ai-governance-v0.10.0
          fetch-depth: 0

      - name: Run project CI validation
        shell: bash
        run: |
          set +e
          dotnet restore TheCertMaster.sln > docs/public-ai-governance/project-ci-restore.txt 2>&1
          RESTORE_RC=$?
          if [ "$RESTORE_RC" -eq 0 ]; then dotnet build TheCertMaster.sln --no-restore > docs/public-ai-governance/project-ci-build.txt 2>&1; BUILD_RC=$?; else BUILD_RC=125; printf 'NotRun: project CI restore did not pass.\n' > docs/public-ai-governance/project-ci-build.txt; fi
          if [ "$BUILD_RC" -eq 0 ]; then dotnet test TheCertMaster.Tests/TheCertMaster.Tests.csproj --no-build --verbosity normal > docs/public-ai-governance/project-ci-test.txt 2>&1; TEST_RC=$?; else TEST_RC=125; printf 'NotRun: project CI build did not pass.\n' > docs/public-ai-governance/project-ci-test.txt; fi
          printf 'PROJECT_CI_RESTORE_RC=%s\nPROJECT_CI_BUILD_RC=%s\nPROJECT_CI_TEST_RC=%s\n' "$RESTORE_RC" "$BUILD_RC" "$TEST_RC" > docs/public-ai-governance/project-ci-validation-status.env
          exit 0

      - name: Commit evidence and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/public-ai-governance-pilot-project-ci.yml
          git config user.name "AIAllTheThingz"
          git config user.email "aiallthethingz@gmail.com"
          git add docs/public-ai-governance .github/workflows/public-ai-governance-pilot-project-ci.yml
          git commit -m "test: validate adoption with project CI prerequisites"
          git push origin HEAD:adoption/public-ai-governance-v0.10.0
