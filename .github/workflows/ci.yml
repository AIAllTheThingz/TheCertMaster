name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Your_strong_Password123
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Your_strong_Password123 -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_SQLSERVER_BASE_CONNECTION: Server=localhost,1433;User Id=sa;Password=Your_strong_Password123;TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False;

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.317

      - name: Restore locked dependencies
        run: dotnet restore TheCertMaster.sln --locked-mode

      - name: Audit dependencies
        shell: bash
        run: |
          dotnet list TheCertMaster.sln package --vulnerable --include-transitive --format json > vulnerability-report.json
          jq -e '[.. | objects | .vulnerabilities? // empty | .[]] | length == 0' vulnerability-report.json > /dev/null || {
            cat vulnerability-report.json
            exit 1
          }

      - name: Build solution including Bootstrapper
        run: dotnet build TheCertMaster.sln --configuration Release --no-restore -p:UseAppHost=false

      - name: Smoke test Bootstrapper argument guard
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          if dotnet TheCertMaster.Bootstrapper/bin/Release/net9.0/TheCertMaster.Bootstrapper.dll > "$output" 2>&1; then
            cat "$output"
            echo 'Bootstrapper unexpectedly accepted missing arguments.'
            exit 1
          fi
          grep -Fqx -- '--connection is required.' "$output"

      - name: Test
        run: dotnet test TheCertMaster.Tests/TheCertMaster.Tests.csproj --configuration Release --no-build --verbosity normal

  package-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.317

      - name: Build the release artifact from the exact commit
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: Server=localhost;Database=TheCertMaster;User Id=sa;Password=CI_only_password123!;TrustServerCertificate=True;Encrypt=False;
          Jwt__Key: CI_only_jwt_key_for_migration_bundle_123456
          Jwt__Issuer: TheCertMaster-CI
          Jwt__Audience: TheCertMaster-CI
          PublicApp__BaseUrl: https://ci.example.invalid
        run: |
          set -euo pipefail
          git cat-file -e "${GITHUB_SHA}^{commit}"
          source_root="${RUNNER_TEMP}/release-source"
          artifact_root="${RUNNER_TEMP}/release-artifact"
          tools_root="${RUNNER_TEMP}/release-tools"
          artifact_zip="${RUNNER_TEMP}/TheCertMaster-${GITHUB_SHA}.zip"
          mkdir -p "$source_root" "$artifact_root/publish" "$artifact_root/bootstrapper" "$artifact_root/migrations" "$artifact_root/scripts" "$artifact_root/source"
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$source_root"
          dotnet restore "$source_root/TheCertMaster.sln" --locked-mode
          dotnet build "$source_root/TheCertMaster.sln" --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -p:UseAppHost=false
          dotnet publish "$source_root/TheCertMaster.csproj" --configuration Release --no-build --no-restore --output "$artifact_root/publish" -p:ContinuousIntegrationBuild=true -p:UseAppHost=false
          dotnet publish "$source_root/TheCertMaster.Bootstrapper/TheCertMaster.Bootstrapper.csproj" --configuration Release --no-build --no-restore --output "$artifact_root/bootstrapper" -p:ContinuousIntegrationBuild=true -p:UseAppHost=false
          dotnet tool install --tool-path "$tools_root" dotnet-ef --version 9.0.10
          "$tools_root/dotnet-ef" migrations bundle --project "$source_root/TheCertMaster.csproj" --startup-project "$source_root/TheCertMaster.csproj" --configuration Release --runtime win-x64 --output "$artifact_root/migrations/efbundle.exe" --force
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$artifact_root/source"
          for deployment_file in configure-smtp-test.ps1 ensure-server-prerequisites.ps1 install-production-application.ps1 post-deploy-smoke-test.ps1 production-settings.template.psd1; do
            cp -a "$source_root/scripts/$deployment_file" "$artifact_root/scripts/$deployment_file"
          done
          printf '{"commit":"%s","repository":"%s"}\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" > "$artifact_root/source/commit-manifest.json"
          dotnet tool install --tool-path "$tools_root" Microsoft.Sbom.DotNetTool --version 4.1.5
          "$tools_root/sbom-tool" generate -b "$artifact_root" -bc "$source_root" -pn TheCertMaster -pv "$GITHUB_SHA" -ps TheCertMaster -nsb "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          "$tools_root/sbom-tool" validate -b "$artifact_root" -o "${RUNNER_TEMP}/sbom-validation.json" -mi SPDX:2.2
          python3 - "$artifact_root" "$GITHUB_SHA" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          files = {}
          for path in sorted(item for item in root.rglob('*') if item.is_file() and item.name != 'artifact-manifest.json'):
              files[path.relative_to(root).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / 'artifact-manifest.json').write_text(
              json.dumps({'commit': sys.argv[2], 'files': files}, separators=(',', ':'), sort_keys=True) + '\n',
              encoding='utf-8')
          PY
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          find "$artifact_root" -type f -exec touch -d "@$source_date_epoch" {} +
          (cd "$artifact_root" && LC_ALL=C find . -type f -print | LC_ALL=C sort | zip -X -q "$artifact_zip" -@)
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$artifact_zip")" > "$(basename "$artifact_zip").sha256")

      - name: Upload immutable deployment artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thecertmaster-deployment-${{ github.sha }}
          path: |
            ${{ runner.temp }}/TheCertMaster-${{ github.sha }}.zip
            ${{ runner.temp }}/TheCertMaster-${{ github.sha }}.zip.sha256
          if-no-files-found: error

      - name: Attest deployment artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/TheCertMaster-${{ github.sha }}.zip

      - name: Attest deployment artifact SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/TheCertMaster-${{ github.sha }}.zip
          sbom-path: ${{ runner.temp }}/release-artifact/_manifest/spdx_2.2/manifest.spdx.json
